[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "oberon"
version = "0.1.0"
description = "Visual editor for the AUTOMATA game engine"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT OR Apache-2.0" }
# NOTE: `automata-engine` is intentionally NOT a dependency here — it is a
# locally built wheel (maturin), not on PyPI. Build and install it first:
#   maturin build --release --manifest-path crates/automata-python/Cargo.toml
#   pip install target/wheels/automata_engine-*.whl
dependencies = [
    "nexa-ui>=1.4",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
oberon = "oberon.app:main"

[tool.setuptools.packages.find]
include = ["oberon*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
