name: Export templates

# Builds the per-platform export templates that `automata-export build` and
# Oberon's Build menu copy games into: the `automata-player` launcher plus a
# portable CPython with the engine wheel installed. Published to the
# `export-templates` release, which `automata-export templates download`
# fetches.

on:
  workflow_dispatch:
  push:
    branches: [main, "arena/**"]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/export.yml"

env:
  CARGO_TERM_COLOR: always
  # python-build-standalone release and interpreter version for the runtime.
  PBS_TAG: "20261110"
  PBS_PYTHON: "3.12.16"

permissions:
  contents: write

jobs:
  template:
    name: template (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux
            os: ubuntu-22.04
            triple: x86_64-unknown-linux-gnu
            python: runtime/bin/python3
            player: automata-player
          - target: windows
            os: windows-latest
            triple: x86_64-pc-windows-msvc
            python: runtime/python.exe
            player: automata-player.exe
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Linux build dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libudev-dev libasound2-dev

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: export-${{ matrix.target }}

      - name: Portable Python
        run: |
          asset="cpython-${PBS_PYTHON}+${PBS_TAG}-${{ matrix.triple }}-install_only_stripped.tar.gz"
          curl -fsSL --retry 3 -o python.tar.gz \
            "https://github.com/astral-sh/python-build-standalone/releases/download/${PBS_TAG}/${asset}"
          mkdir -p template
          tar xzf python.tar.gz -C template
          mv template/python template/runtime
          template/${{ matrix.python }} --version

      - name: Build the player and exporter
        run: cargo build --release -p automata-player -p automata-export

      - name: Build and install the engine wheel
        run: |
          PY="$PWD/template/${{ matrix.python }}"
          "$PY" -m pip install --no-cache-dir "maturin>=1.7,<2.0"
          "$PY" -m maturin build --release --manifest-path crates/automata-python/Cargo.toml \
            -i "$PY" --out wheels --auditwheel skip
          "$PY" -m pip install --no-cache-dir wheels/*.whl
          "$PY" -m pip uninstall -y maturin
          # Trim what a shipped game never needs.
          rm -rf template/runtime/include template/runtime/share
          find template/runtime -name __pycache__ -type d -prune -exec rm -rf {} +
          find template/runtime -type d \( -name test -o -name tests -o -name idlelib -o -name tkinter -o -name turtledemo -o -name ensurepip \) -path '*/lib*/*' -prune -exec rm -rf {} + || true

      - name: Smoke test the runtime
        run: template/${{ matrix.python }} -c "import automata; print('automata', automata.__file__)"

      - name: Pack the template
        run: |
          cp target/release/${{ matrix.player }} template/
          ./target/release/automata-export templates pack template \
            --target ${{ matrix.target }} --out automata-template-${{ matrix.target }}-x86_64.tar.gz

      # Export a real example with the fresh template and run it headless.
      - name: Export and run an example
        run: |
          export AUTOMATA_TEMPLATES="$PWD/templates"
          ./target/release/automata-export templates install \
            automata-template-${{ matrix.target }}-x86_64.tar.gz --target ${{ matrix.target }}
          cp -r examples/oberon/coin_run /tmp/coin_run
          ./target/release/automata-export init /tmp/coin_run --scene level.ron --name "Coin Run"
          ./target/release/automata-export build /tmp/coin_run --target ${{ matrix.target }}
          exe="/tmp/coin_run/build/${{ matrix.target }}/Coin Run/Coin Run"
          if [ "${{ matrix.target }}" = windows ]; then exe="$exe.exe"; fi
          "$exe" --headless --frames 30

      - uses: actions/upload-artifact@v4
        with:
          name: automata-template-${{ matrix.target }}
          path: automata-template-${{ matrix.target }}-x86_64.tar.gz

  publish:
    name: publish
    needs: template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Update the export-templates release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -la dist
          gh release view export-templates >/dev/null 2>&1 || \
            gh release create export-templates --title "Export templates" --prerelease \
              --notes "Templates for automata-export / Oberon Build. Installed with: automata-export templates download"
          gh release upload export-templates dist/*.tar.gz --clobber
