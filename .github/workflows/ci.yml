name: CI

on:
  push:
    branches: [main, "arena/**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  test:
    name: fmt / clippy / test / doc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Software GPU (llvmpipe/lavapipe) so wgpu render tests actually
      # execute — without it they graceful-skip and the renderer goes
      # untested on CI.
      - name: Install software GPU
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1-mesa libgl1-mesa-dri mesa-vulkan-drivers

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace --all-targets
        env:
          WGPU_BACKEND: vulkan,gl

      - name: Documentation
        run: cargo doc --workspace --no-deps
