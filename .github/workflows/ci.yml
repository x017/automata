name: CI

on:
  push:
    branches: [main, "arena/**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  test:
    name: fmt / clippy / test / doc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Software GPU (llvmpipe/lavapipe) so wgpu render tests actually
      # execute — without it they graceful-skip and the renderer goes
      # untested on CI. Retry around the apt lock race on hosted runners.
      - name: Install software GPU
        run: |
          for i in 1 2 3; do
            sudo apt-get update && \
            sudo apt-get install -y --no-install-recommends \
              libegl1 libgl1 mesa-vulkan-drivers libvulkan1 && break
            echo "apt attempt $i failed; retrying in 10s"
            sleep 10
          done

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests (CPU + device)
        run: cargo test --workspace --all-targets -- --skip offscreen
        env:
          WGPU_BACKEND: vulkan,gl

      # Run GPU offscreen render tests separately so a software-adapter
      # quirk doesn't mask the CPU suite, and so its failure is isolated.
      - name: Tests (GPU offscreen)
        run: cargo test -p automata-renderer --lib offscreen -- --nocapture
        env:
          WGPU_BACKEND: vulkan,gl

      - name: Documentation
        run: cargo doc --workspace --no-deps
