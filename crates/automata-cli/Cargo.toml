[package]
name = "automata-cli"
description = "The AUTOMATA command line: exports games to standalone Windows, Linux and Android builds (also used by Oberon's Build)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
automata-assets = { path = "../automata-assets" }
automata-core = { path = "../automata-core" }
automata-physics = { path = "../automata-physics" }
serde.workspace = true
ron.workspace = true
flate2 = "1.1"
crc32fast = "1.5"
# Android builds: signing with the machine's debug key.
num-bigint = "0.4.8"
num-traits = "0.2.19"
getrandom = "0.4.3"

[[bin]]
name = "automata-cli"
path = "src/main.rs"
