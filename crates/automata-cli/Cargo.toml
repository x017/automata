[package]
name = "automata-cli"
description = "The AUTOMATA command line: exports games to standalone Windows and Linux builds (also used by Oberon's Build)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
automata-assets = { path = "../automata-assets" }
automata-core = { path = "../automata-core" }
automata-physics = { path = "../automata-physics" }
serde.workspace = true
ron.workspace = true
flate2 = "1.1"
crc32fast = "1.5"

[[bin]]
name = "automata-cli"
path = "src/main.rs"
